<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KingdomEngine · Émulateur Discord</title>
<style>
  :root {
    --bg: #000000; --panel: #0d0d0d; --panel-2: #151515; --line: #262626; --text: #ffffff; --muted: #a1a1a1;
    --accent: #34c27d; --accent-2: #0a6b45;
    --d-bg: #313338; --d-bg-2: #2b2d31; --d-text: #dbdee1; --d-muted: #949ba4; --d-line: #3f4147;
    --d-primary: #5865f2; --d-secondary: #4e5058; --d-success: #248046; --d-danger: #da373c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "gg sans", "Segoe UI", system-ui, -apple-system, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr) 320px; height: 100vh; }
  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; height: auto; } .side, .inspector { border: 0 !important; } }

  /* Barre latérale */
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #0a6b45; box-shadow: inset 0 0 0 2px rgba(255,255,255,.85); display: grid; place-items: center; font-weight: 700; color: #fff; }
  .brand b { display: block; font-size: 14px; } .brand small { color: var(--muted); font-size: 12px; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .players { display: flex; flex-direction: column; gap: 4px; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--text); text-align: left; }
  .pl:hover { background: var(--panel-2); }
  .pl.on { background: var(--panel-2); border-color: var(--line); }
  .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #0b0f0d; }
  .ghost { background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 8px; padding: 7px; }
  .ghost:hover { color: var(--text); border-color: var(--accent-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  .chip:hover { border-color: var(--accent-2); }
  .chip.on { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .note { color: var(--muted); font-size: 12px; margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }

  /* Canal Discord */
  .channel { background: var(--d-bg); color: var(--d-text); overflow: auto; display: flex; flex-direction: column; }
  .chan-head { position: sticky; top: 0; z-index: 2; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--d-bg); border-bottom: 1px solid #1f2023; font-weight: 600; }
  .chan-head .hash { color: var(--d-muted); font-size: 20px; font-weight: 400; }
  .chan-head .tag { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--d-muted); background: #2b2d31; padding: 3px 8px; border-radius: 4px; }
  .msgs { padding: 16px 0 40px; }
  .msg { display: grid; grid-template-columns: 56px minmax(0, 1fr); padding: 2px 48px 2px 16px; }
  .msg:hover { background: #2e3035; }
  .bot-av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #c58b38, #885c34); display: grid; place-items: center; font-size: 20px; margin-top: 2px; }
  .meta { display: flex; align-items: baseline; gap: 6px; }
  .meta b { color: #f2f3f5; font-weight: 600; }
  .app-tag { background: var(--d-primary); color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 0 4px; line-height: 15px; }
  .meta time { color: var(--d-muted); font-size: 12px; }
  .cmd { color: var(--d-muted); font-size: 13px; margin: 0 0 2px 72px; }
  .cmd b { color: #c9cdfb; font-weight: 500; }
  .v2 { display: flex; flex-direction: column; gap: 8px; max-width: 600px; margin-top: 4px; }
  .ctn { background: var(--d-bg-2); border: 1px solid #26282c; border-left: 4px solid var(--d-line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .txt h1, .txt h2, .txt h3 { margin: 0; line-height: 1.25; color: #f2f3f5; }
  .txt h1 { font-size: 24px; } .txt h2 { font-size: 20px; } .txt h3 { font-size: 16px; }
  .txt code { background: #1e1f22; border-radius: 4px; padding: 0 3px; font-size: 85%; font-family: Consolas, monospace; }
  .mention { background: rgba(88,101,242,.3); color: #dee0fc; border-radius: 3px; padding: 0 2px; font-weight: 500; }
  .ts { background: #3a3c42; border-radius: 3px; padding: 0 2px; }
  .sec { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .sec .txt { flex: 1; }
  .sep { height: 1px; background: var(--d-line); margin: 4px 0; } .sep.lg { margin: 10px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { border: 0; border-radius: 8px; padding: 0 14px; min-height: 32px; color: #fff; font-weight: 500; font-size: 14px; white-space: nowrap; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); } .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--d-primary); } .btn.secondary { background: var(--d-secondary); }
  .btn.success { background: var(--d-success); } .btn.danger { background: var(--d-danger); }
  .sel { position: relative; width: 100%; max-width: 560px; }
  .sel select { appearance: none; width: 100%; background: #1e1f22; color: var(--d-text); border: 1px solid #1e1f22; border-radius: 8px; padding: 9px 36px 9px 12px; font: inherit; }
  .sel select:hover { border-color: #111214; }
  .sel::after { content: "⌄"; position: absolute; right: 12px; top: 6px; color: var(--d-muted); pointer-events: none; }
  .ephemeral { margin: 6px 48px 0 72px; font-size: 13px; color: var(--d-muted); }
  .ephemeral div { color: var(--d-text); background: #2b2d31; border-radius: 8px; padding: 8px 12px; margin-top: 4px; }
  .flash { animation: flash .5s ease; } @keyframes flash { from { background: #3a3d44; } to { background: transparent; } }

  /* Inspecteur */
  .inspector { background: var(--panel); border-left: 1px solid var(--line); padding: 18px 16px; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h4 { margin: 0 0 8px; font-size: 13px; color: var(--accent); font-weight: 600; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13px; }
  .kv > span:not(.v) { color: var(--muted); } .kv > .v { font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
  .bar { height: 6px; background: #0e1311; border-radius: 3px; overflow: hidden; grid-column: 1 / -1; margin-bottom: 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; }
  .diag { font-size: 12px; color: var(--muted); }
  .diag b { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">K</div><div><b>KingdomEngine</b><small>Émulateur · <span id="world-name"></span></small></div></div>
    <div>
      <div class="label">Joueurs simulés</div>
      <div class="players" id="players"></div>
      <button class="ghost" id="add-player" style="width:100%;margin-top:6px">+ Ajouter un joueur</button>
    </div>
    <div>
      <div class="label">Bâtiment</div>
      <div class="chips" id="buildings"></div>
    </div>
    <div>
      <div class="label">Temps simulé</div>
      <div class="chips">
        <button class="chip" data-skip="10">+10 s</button><button class="chip" data-skip="60">+1 min</button>
        <button class="chip" data-skip="300">+5 min</button><button class="chip" data-skip="3600">+1 h</button>
      </div>
      <div class="clock" id="clock"></div>
    </div>
    <div>
      <div class="label">Variables du monde</div>
      <div id="variables"></div>
    </div>
    <div>
      <div class="label">Outils de test</div>
      <div class="chips" id="tools"></div>
    </div>
    <div class="note">Le moteur exécuté ici est <b>exactement</b> celui du bot. L’apparence imite Discord sans être son moteur de rendu officiel. Données fictives, en mémoire.</div>
  </aside>

  <main class="channel">
    <div class="chan-head"><span class="hash">#</span><span id="chan-name">taverne</span><span class="tag">Aperçu · Components V2</span></div>
    <div class="msgs" id="msgs"></div>
  </main>

  <aside class="inspector" id="inspector"></aside>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
const WORLD = /*__WORLD__*/null;

// ---------------------------------------------------------------------------
// État de l'émulateur
// ---------------------------------------------------------------------------
let offset = 0;
const now = () => Date.now() + offset;
const COLORS = ['#5fb38a', '#e0a458', '#7aa7e0', '#d77fa1', '#b39ddb', '#80cbc4'];
const NAMES = ['Alice', 'Bertrand', 'Clotilde', 'Dagobert', 'Éloïse', 'Fulbert'];
let engine, players, current, building;

function boot() {
  engine = new Engine(WORLD, undefined, { now });
  players = [];
  building = WORLD.buildings[0].id;
  addPlayer(); addPlayer();
  current = players[0].id;
  renderAll();
}
function addPlayer() {
  const i = players.length;
  if (i >= NAMES.length) return;
  const p = { id: 'joueur' + (i + 1), name: NAMES[i], color: COLORS[i], sessions: {}, ephemeral: null };
  players.push(p);
  return p;
}
const me = () => players.find((p) => p.id === current);
const nameOf = (id) => players.find((p) => p.id === id)?.name ?? id;
function session(p) {
  if (!p.sessions[building]) p.sessions[building] = engine.openSession(p.id, building).sessionId;
  return p.sessions[building];
}

// ---------------------------------------------------------------------------
// Markdown Discord (sous-ensemble)
// ---------------------------------------------------------------------------
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return s
    .replace(/&lt;@([\w-]+)&gt;/g, (_, id) => `<span class="mention">@${esc(nameOf(id))}</span>`)
    .replace(/&lt;t:(\d+):?\w?&gt;/g, (_, t) => `<span class="ts">${new Date(t * 1000).toLocaleTimeString('fr-FR')}</span>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/__([^_]+)__/g, '<u>$1</u>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
}
function md(src) {
  return esc(src).split('\n').map((line) => {
    const h = /^(#{1,3}) (.*)$/.exec(line);
    if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    return inline(line);
  }).join('\n').replace(/(<\/h\d>)\n/g, '$1');
}

// ---------------------------------------------------------------------------
// Rendu des composants
// ---------------------------------------------------------------------------
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function renderComponent(c) {
  switch (c.type) {
    case 'text': return el('div', 'txt', md(c.content));
    case 'separator': return el('div', c.large ? 'sep lg' : 'sep');
    case 'section': {
      const s = el('div', 'sec');
      const t = el('div', 'txt', md(c.texts.map((x) => x.content).join('\n')));
      s.append(t, renderButton(c.accessory));
      return s;
    }
    case 'row': {
      const r = el('div', 'row');
      for (const it of c.items) r.append(it.type === 'button' ? renderButton(it) : renderSelect(it));
      return r;
    }
    case 'container': {
      const box = el('div', 'ctn');
      if (c.accent !== undefined) box.style.borderLeftColor = '#' + c.accent.toString(16).padStart(6, '0');
      for (const ch of c.children) box.append(renderComponent(ch));
      return box;
    }
  }
  return el('div');
}
function renderButton(b) {
  const btn = el('button', `btn ${b.style}`);
  btn.textContent = (b.emoji ? b.emoji + ' ' : '') + b.label;
  btn.onclick = () => act(b.customId, []);
  return btn;
}
function renderSelect(s) {
  const wrap = el('div', 'sel');
  const sel = el('select');
  const ph = el('option'); ph.textContent = s.placeholder; ph.value = ''; ph.disabled = true;
  sel.append(ph);
  let hasDefault = false;
  for (const o of s.options) {
    const opt = el('option');
    opt.value = o.value;
    opt.textContent = (o.emoji ? o.emoji + ' ' : '') + o.label + (o.description ? ' — ' + o.description : '');
    if (o.default) { opt.selected = true; hasDefault = true; }
    sel.append(opt);
  }
  if (!hasDefault) ph.selected = true;
  sel.onchange = () => act(s.customId, [sel.value]);
  wrap.append(sel);
  return wrap;
}

function act(customId, values) {
  const p = me();
  const r = engine.interact(p.id, customId, values);
  p.ephemeral = r.private ?? null;
  renderAll(true);
}

// ---------------------------------------------------------------------------
// Écran
// ---------------------------------------------------------------------------
let lastJson = '';
function renderChannel(flash) {
  const p = me();
  const b = WORLD.buildings.find((x) => x.id === building);
  document.getElementById('chan-name').textContent = b.id;
  const view = engine.view(session(p));
  const json = JSON.stringify(view.message);
  if (json === lastJson && !flash) return;
  lastJson = json;
  const msgs = document.getElementById('msgs');
  msgs.innerHTML = '';
  msgs.append(el('div', 'cmd', `<b>${esc(p.name)}</b> a utilisé <b>/${esc(b.id)}</b>`));
  const m = el('div', 'msg');
  m.append(el('div', 'bot-av', b.emoji ?? '🏰'));
  const body = el('div');
  body.append(el('div', 'meta', `<b>${esc(WORLD.name)}</b><span class="app-tag">APP</span><time>${new Date(now()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</time>`));
  const v2 = el('div', 'v2' + (flash ? ' flash' : ''));
  for (const c of view.message.components) v2.append(renderComponent(c));
  body.append(v2);
  m.append(body);
  msgs.append(m);
  if (p.ephemeral) msgs.append(el('div', 'ephemeral', `👁️ Seul·e toi peux voir ceci<div>${md(p.ephemeral)}</div>`));
  const issues = validateRendered(view.message);
  if (issues.length) msgs.append(el('div', 'ephemeral', `⚠️ Limites Discord dépassées : ${esc(issues.join(' · '))}`));
}

function renderSide() {
  document.getElementById('world-name').textContent = WORLD.name;
  const list = document.getElementById('players');
  list.innerHTML = '';
  for (const p of players) {
    const b = el('button', 'pl' + (p.id === current ? ' on' : ''));
    b.innerHTML = `<span class="av" style="background:${p.color}">${p.name[0]}</span>${esc(p.name)}`;
    b.onclick = () => { current = p.id; lastJson = ''; renderAll(); };
    list.append(b);
  }
  const bl = document.getElementById('buildings');
  bl.innerHTML = '';
  for (const b of WORLD.buildings) {
    const c = el('button', 'chip' + (b.id === building ? ' on' : ''), esc(`${b.emoji ?? ''} ${b.name}`));
    c.onclick = () => { building = b.id; lastJson = ''; renderAll(); };
    bl.append(c);
  }
  const vars = document.getElementById('variables');
  vars.innerHTML = '';
  for (const v of WORLD.variables) {
    const wrap = el('div', 'chips');
    for (const o of v.options ?? []) {
      const c = el('button', 'chip' + (engine.variables[v.id] === o.value ? ' on' : ''), esc(o.label));
      c.onclick = () => { engine.adminApply(me().id, building, [{ type: 'variable.set', variable: v.id, value: o.value }]); renderAll(true); };
      wrap.append(c);
    }
    vars.append(el('div', 'label', esc(v.name)), wrap);
  }
  const tools = document.getElementById('tools');
  tools.innerHTML = '';
  const tool = (label, fn) => { const c = el('button', 'chip', label); c.onclick = () => { fn(); renderAll(true); }; tools.append(c); };
  for (const j of WORLD.jobs) {
    tool(`${j.emoji ?? ''} ${j.name}`, () => {
      const p = engine.player(me().id);
      const leave = (p?.activeJobs ?? []).map((x) => ({ type: 'job.leave', job: x }));
      engine.adminApply(me().id, building, [...leave, { type: 'job.join', job: j.id }]);
    });
    tool(`${j.name} niv. +1`, () => {
      const lvl = engine.player(me().id)?.jobs[j.id]?.level ?? 1;
      engine.adminApply(me().id, building, [{ type: 'job.setLevel', job: j.id, level: lvl + 1 }]);
    });
  }
  const cur = WORLD.stats.find((s) => s.kind === 'currency');
  if (cur) tool(`${cur.emoji ?? ''} +100`, () => engine.adminApply(me().id, building, [{ type: 'stat.add', stat: cur.id, amount: 100 }]));
  tool('↺ Réinitialiser', () => { offset = 0; boot(); });
  document.getElementById('clock').textContent = `Horloge : ${new Date(now()).toLocaleTimeString('fr-FR')}${offset ? ` (+${Math.round(offset / 1000)} s)` : ''}`;
}

function renderInspector() {
  const box = document.getElementById('inspector');
  const ps = engine.player(me().id);
  const st = engine.snapshot();
  const W = WORLD;
  const itemName = (id) => { const i = W.items.find((x) => x.id === id); return i ? `${i.emoji ?? ''} ${i.name}` : id; };
  let html = '';
  html += `<div class="card"><h4>👤 ${esc(me().name)}</h4><div class="kv">`;
  for (const s of W.stats) {
    const v = ps?.stats[s.id] ?? s.initial;
    html += `<span>${esc(`${s.emoji ?? ''} ${s.name}`)}</span><span class="v">${v}${s.max ? '/' + s.max : ''}</span>`;
    if (s.max) html += `<div class="bar"><i style="width:${(v / s.max) * 100}%"></i></div>`;
  }
  for (const j of W.jobs) {
    const pr = ps?.jobs[j.id];
    if (!pr && !ps?.activeJobs.includes(j.id)) continue;
    html += `<span>${esc(`${j.emoji ?? ''} ${j.name}`)}${ps.activeJobs.includes(j.id) ? ' · actif' : ''}</span><span class="v">niv. ${pr?.level ?? 1} · ${pr?.xp ?? 0} XP</span>`;
  }
  for (const m of ps?.modifiers ?? []) {
    if (m.expiresAt <= now()) continue;
    const d = W.modifiers.find((x) => x.id === m.id);
    html += `<span>✨ ${esc(d?.name ?? m.id)}</span><span class="v">${Math.ceil((m.expiresAt - now()) / 1000)} s</span>`;
  }
  html += '</div></div>';
  const items = Object.entries(ps?.items ?? {}).filter(([, q]) => q > 0);
  html += `<div class="card"><h4>🎒 Inventaire</h4>${items.length ? '<div class="kv">' + items.map(([k, q]) => `<span>${esc(itemName(k))}</span><span class="v">${q}</span>`).join('') + '</div>' : '<div class="empty">Vide</div>'}</div>`;
  const b = W.buildings.find((x) => x.id === building);
  for (const m of b.modules) {
    if (m.type === 'inventory') {
      const inv = st.inventories[`${b.id}/${m.id}`] ?? {};
      const keys = [...new Set([...Object.keys(m.targets), ...Object.keys(inv)])];
      html += `<div class="card"><h4>${esc(`${m.emoji ?? '📦'} ${m.name}`)}</h4><div class="kv">${keys.map((k) => `<span>${esc(itemName(k))}</span><span class="v">${inv[k] ?? 0}${m.targets[k] ? ' / ' + m.targets[k] : ''}</span>`).join('')}</div></div>`;
    }
    if (m.type === 'production') {
      const ss = st.stations[`${b.id}/${m.id}`] ?? [];
      html += `<div class="card"><h4>⏳ ${esc(m.name)}</h4><div class="kv">${ss.map((s, i) => {
        const r = s && m.recipes.find((x) => x.id === s.recipe);
        const left = s ? Math.max(0, Math.ceil((s.endsAt - now()) / 1000)) : 0;
        return `<span>${esc(m.stationName)} ${i + 1}</span><span class="v">${s ? `${esc(r?.name ?? '?')} · ${left ? left + ' s' : 'prêt'}` : 'libre'}</span>`;
      }).join('')}</div></div>`;
    }
  }
  const issues = validateWorld(W);
  html += `<div class="card"><h4>🩺 Diagnostic du monde</h4><div class="diag"><b>${issues.filter((i) => i.level === 'error').length}</b> erreur(s) · <b>${issues.filter((i) => i.level === 'warning').length}</b> avertissement(s) · révision ${engine.revision}</div></div>`;
  box.innerHTML = html;
}

function renderAll(flash) { renderSide(); renderChannel(flash); renderInspector(); }

document.getElementById('add-player').onclick = () => { const p = addPlayer(); if (p) { current = p.id; lastJson = ''; renderAll(); } };
document.querySelectorAll('[data-skip]').forEach((b) => (b.onclick = () => { offset += Number(b.dataset.skip) * 1000; renderAll(); }));
setInterval(() => { renderChannel(false); renderInspector(); document.getElementById('clock').textContent = `Horloge : ${new Date(now()).toLocaleTimeString('fr-FR')}${offset ? ` (+${Math.round(offset / 1000)} s)` : ''}`; }, 1000);
boot();
</script>
</body>
</html>
