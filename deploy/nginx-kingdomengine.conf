# KingdomEngine derrière nginx, en HTTPS.
# 1. Remplace studio.exemple.fr par ton domaine (ses DNS doivent pointer vers ce serveur).
# 2. sudo cp deploy/nginx-kingdomengine.conf /etc/nginx/sites-available/kingdomengine
#    sudo ln -s /etc/nginx/sites-available/kingdomengine /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. Certificat gratuit : sudo certbot --nginx -d studio.exemple.fr
# 4. Dans /etc/kingdomengine.env : KINGDOM_SECURE_COOKIES=1, puis sudo systemctl restart kingdomengine

server {
    listen 80;
    listen [::]:80;
    server_name studio.exemple.fr;

    # Les sons importés dans la médiathèque peuvent être volumineux.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
